<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="shieldBorderGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="shieldFillGrad" x1="64" y1="12" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192038" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1220" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="starOuterCyan" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="starDiagonalPurple" x1="38" y1="38" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4361EE"/>
      <stop offset="55%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#B5179E"/>
    </linearGradient>
  </defs>

  <!-- Outer Celestial Dashed Orbit -->
  <circle cx="64" cy="64" r="58" stroke="url(#shieldBorderGrad)" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.55"/>

  <!-- Zero Trust Shield Silhouette -->
  <path d="M64 12L106 28V60C106 87.5 87.8 108.6 64 116C40.2 108.6 22 87.5 22 60V28L64 12Z"
        fill="url(#shieldFillGrad)"
        stroke="url(#shieldBorderGrad)"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Inner Shield Accent Line -->
  <path d="M64 19L99 32.5V59.5C99 82.8 83.8 100.8 64 107.8C44.2 100.8 29 82.8 29 59.5V32.5L64 19Z"
        stroke="#00F5D4"
        stroke-width="1"
        stroke-opacity="0.25"/>

  <!-- Ch'asca 8-Point Star Emblem Inside Shield -->
  <!-- Primary 4 Cardinal Points (Mint/Cyan) -->
  <path d="M64 26C64 47 47 64 26 64C47 64 64 81 64 102C64 81 81 64 102 64C81 64 64 47 64 26Z"
        fill="url(#starOuterCyan)"/>

  <!-- Diagonal 4 Points (Blue to Cosmic Purple) -->
  <path d="M41 41C53.5 53.5 74.5 53.5 87 41C74.5 53.5 74.5 74.5 87 87C74.5 74.5 53.5 74.5 41 87C53.5 74.5 53.5 53.5 41 41Z"
        fill="url(#starDiagonalPurple)"/>

  <!-- Core Inner White Star -->
  <path d="M64 49L68.2 59.8L79 64L68.2 68.2L64 79L59.8 68.2L49 64L59.8 59.8L64 49Z"
        fill="#FFFFFF"/>
  <circle cx="64" cy="64" r="2.5" fill="#E0FBFC"/>
</svg>

