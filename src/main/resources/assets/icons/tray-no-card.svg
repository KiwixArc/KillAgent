<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="warnOrbitGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </linearGradient>
    <linearGradient id="warnCrescentGrad" x1="22" y1="10" x2="54" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="55%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#D62828"/>
