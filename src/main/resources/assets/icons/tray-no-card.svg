  <!-- Outer Killa Crescent (Amber/Orange) -->
  <path d="M35.5 11.5C45.8 14.2 52.5 23.6 52.5 34.5C52.5 46.8 42.3 55.5 29.5 54.2C26.8 53.9 24.3 53.2 22.2 52.1C33.8 51.4 43.2 42.5 43.8 31.0C44.3 22.4 40.4 15.8 35.5 11.5Z" fill="url(#warnCrescentGrad)"/>

  <!-- Inner Killa Crescent -->
  <path d="M28.5 17.5C35.8 20.2 40.2 26.8 39.8 34.6C39.3 42.6 32.8 48.2 24.4 47.4C23.1 47.2 21.8 46.9 20.6 46.4C28.1 45.6 33.8 39.8 34.0 32.2C34.2 25.8 31.6 21.0 28.5 17.5Z" fill="url(#warnInnerArc)" fill-opacity="0.85"/>

  <!-- Smart Card Slot & Card Prompt Icon on Left -->
  <rect x="13" y="23" width="15" height="11" rx="2" stroke="#FFB703" stroke-width="1.8" fill="#1A1F2E"/>
  <rect x="16" y="26" width="4" height="3.5" rx="0.8" fill="#FFE169"/>
  <!-- Insertion slot line -->
  <path d="M11 38H30" stroke="#FFE169" stroke-width="2" stroke-linecap="round"/>

  <!-- Alert Satellite Badge -->
  <circle cx="49" cy="16" r="6.5" fill="#FFB703" stroke="#10141E" stroke-width="1.8"/>
  <path d="M49 13V16.8" stroke="#10141E" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="49" cy="19.3" r="1.1" fill="#10141E"/>
