      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
    <linearGradient id="busyCrescentGrad" x1="20" y1="10" x2="54" y2="55" gradientUnits="userSpaceOnUse">
