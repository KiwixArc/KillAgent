<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="readyOrbitGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <linearGradient id="readyCrescentGrad" x1="20" y1="10" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="readyInnerArc" x1="16" y1="18" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72EFDD"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <linearGradient id="readyStarGrad" x1="12" y1="22" x2="28" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#80FFDB"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
  </defs>

  <!-- Dark subtle badge backdrop for maximum contrast on both Light and Dark Windows 11 taskbars -->
  <circle cx="32" cy="32" r="29" fill="#10141E" fill-opacity="0.92"/>

  <!-- Outer dashed celestial orbit -->
  <circle cx="32" cy="32" r="27" stroke="url(#readyOrbitGrad)" stroke-width="1.8" stroke-dasharray="3.5 3.5" stroke-linecap="round"/>

  <!-- Outer Killa Crescent (Ready Emerald/Cyan) -->
  <path d="M35.5 11.5C45.8 14.2 52.5 23.6 52.5 34.5C52.5 46.8 42.3 55.5 29.5 54.2C26.8 53.9 24.3 53.2 22.2 52.1C33.8 51.4 43.2 42.5 43.8 31.0C44.3 22.4 40.4 15.8 35.5 11.5Z" fill="url(#readyCrescentGrad)"/>

  <!-- Inner Killa Crescent -->
  <path d="M28.5 17.5C35.8 20.2 40.2 26.8 39.8 34.6C39.3 42.6 32.8 48.2 24.4 47.4C23.1 47.2 21.8 46.9 20.6 46.4C28.1 45.6 33.8 39.8 34.0 32.2C34.2 25.8 31.6 21.0 28.5 17.5Z" fill="url(#readyInnerArc)"/>

  <!-- Ch'aska 4-point Star (Active/Verified) -->
  <path d="M21 21C21 26.2 16.8 30.4 11.6 30.4C16.8 30.4 21 34.6 21 39.8C21 34.6 25.2 30.4 30.4 30.4C25.2 30.4 21 26.2 21 21Z" fill="url(#readyStarGrad)"/>
  <circle cx="21" cy="30.4" r="1.6" fill="#FFFFFF"/>

  <!-- Active Ready Check Satellite Badge -->
  <circle cx="49" cy="16" r="6.5" fill="#06D6A0" stroke="#10141E" stroke-width="1.8"/>
  <path d="M46.2 16.2L48.1 18.1L52.0 14.2" stroke="#10141E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

