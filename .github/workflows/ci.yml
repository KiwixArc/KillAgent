name: KILLAgent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven Test & Package (Java 21 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and package shaded JAR
        run: mvn -B clean package

      - name: Upload Surefire test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: killagent-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload shaded KILLAgent JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: killagent-shaded-jar
          path: target/killagent-*.jar
          if-no-files-found: error
          retention-days: 14
