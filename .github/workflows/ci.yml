name: KILLAgent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven Test, Package & Portable Smoke Check (Java 21 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit/integration tests and build portable Windows package
        shell: pwsh
        run: |
          .\package-windows.ps1 -PackageType portable
          .\dist\KILLAgent\KILLAgent.exe --version
          java -jar (Get-Item dist\killagent-*.jar | Select-Object -First 1).FullName --version

      - name: Upload Surefire test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: killagent-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload KILLAgent portable & manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: killagent-portable-dist
          path: |
            dist/*-portable.zip
            dist/*.jar
            dist/update-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
